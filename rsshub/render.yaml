services:
  - type: web
    name: zenfest-rsshub
    runtime: image
    image:
      url: docker.io/diygod/rsshub:latest
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: CACHE_TYPE
        value: memory
      - key: CACHE_EXPIRE
        value: "900"
