name: Radar poller

# Fetches sources and queues new articles on GitHub's free runners (no LLM, no AI key).
# Claude summarises the queue as a scheduled task (see backend/claude_queue.py).
# Needs one repository secret: DATABASE_URL. Optional: RSSHUB_URL (self-hosted RSSHub).
on:
  schedule:
    - cron: "7,37 * * * *" # feeds: every 30 minutes (GitHub may start it a few minutes late)
    - cron: "17 0,12 * * *" # startup directory: twice a day
  workflow_dispatch: {}

concurrency:
  group: radar-poller
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RSSHUB_URL: ${{ secrets.RSSHUB_URL }} # optional: self-hosted RSSHub address
      ENABLE_SCHEDULER: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets are present
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add DATABASE_URL under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Queue new articles
        if: github.event.schedule != '17 0,12 * * *'
        run: python ingest.py

      - name: Refresh startup directory
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0,12 * * *'
        run: python startups_sync.py
